<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2563eb" />
    <title>Log in · AntechEvents</title>
    <meta name="description" content="Log in to your AntechEvents personal event command center." />
    <link rel="icon" href="/assets/icons/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/assets/icons/favicon.svg" />
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
    <link rel="stylesheet" href="/css/output.css" />
  </head>
  <body class="min-h-full bg-canvas">
    <main id="main" class="flex min-h-full flex-col">
      <div class="container-app flex flex-1 items-center justify-center py-10">
        <div class="w-full max-w-md">
          <a href="/" class="mb-6 flex items-center justify-center gap-2 text-base font-semibold text-ink">
            <span class="inline-flex h-9 w-9 items-center justify-center rounded-lg bg-primary text-white">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/><path d="m9 16 2 2 4-4"/></svg>
            </span>
            <span>AntechEvents</span>
          </a>

          <div class="card card-pad sm:p-6">
            <h1 class="text-xl font-semibold text-ink">Welcome back</h1>
            <p class="mt-1 text-sm text-muted">Log in to your event command center.</p>

            <div data-config-note hidden class="mt-4 rounded-btn border border-warning/40 bg-warning/10 px-3 py-2 text-sm text-ink">
              Firebase isn't configured yet. Add your web config in
              <code class="rounded bg-surface px-1 py-0.5 text-xs">js/firebase.js</code> to enable sign-in.
            </div>

            <form id="loginForm" class="mt-5 space-y-4" novalidate>
              <div>
                <label class="label" for="email">Email</label>
                <input id="email" name="email" type="email" autocomplete="email" required class="input" placeholder="you@example.com" />
              </div>
              <div>
                <div class="flex items-center justify-between">
                  <label class="label mb-0" for="password">Password</label>
                  <button type="button" id="forgotLink" class="text-xs font-medium text-primary hover:underline">Forgot password?</button>
                </div>
                <div class="relative mt-1.5">
                  <input id="password" name="password" type="password" autocomplete="current-password" required class="input pr-11" placeholder="Your password" />
                  <button type="button" data-toggle-password aria-label="Show password" aria-pressed="false" class="absolute inset-y-0 right-0 flex items-center px-3 text-muted hover:text-ink">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                  </button>
                </div>
              </div>
              <p id="formError" class="error-text" role="alert" aria-live="assertive"></p>
              <button type="submit" id="submitBtn" class="btn btn-primary btn-block">Log in</button>
            </form>

            <div class="my-4 flex items-center gap-3 text-xs font-medium uppercase text-muted">
              <span class="h-px flex-1 bg-line"></span>Or<span class="h-px flex-1 bg-line"></span>
            </div>

            <button type="button" id="googleBtn" class="btn btn-secondary btn-block">
              <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
              <span>Continue with Google</span>
            </button>

            <p class="mt-5 text-center text-sm text-muted">
              New to AntechEvents?
              <a href="/register" class="font-medium text-primary hover:underline">Create an account</a>
            </p>
          </div>
        </div>
      </div>
    </main>

    <script type="module" src="/js/login.js"></script>
  </body>
</html>
